<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img">
  <title>Create Project</title>
  <desc>Vector icon for creating a new project in engineering drawing management software</desc>

  <!-- Document outline with folded corner (3 corners rounded) -->
  <path d="M19 15 L39 15 L49 25 L49 48 A3 3 0 0 1 46 51 L19 51 A3 3 0 0 1 16 48 L16 18 A3 3 0 0 1 19 15 Z"
        stroke="#5B7C99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blueprint grid lines -->
  <line x1="22" y1="28" x2="43" y2="28" stroke="#5B7C99" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="33" x2="36" y2="33" stroke="#5B7C99" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="30" y2="33" stroke="#5B7C99" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Technical drawing corner crop mark -->
  <path d="M23 23 L27 23 M23 23 L23 27" stroke="#5B7C99" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Plus symbol (solid filled) -->
  <rect x="26" y="39" width="12" height="3" rx="1.5" fill="#5B7C99"/>
  <rect x="30.5" y="35" width="3" height="11" rx="1.5" fill="#5B7C99"/>
</svg>
